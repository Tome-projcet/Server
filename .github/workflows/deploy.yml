name: Docker Image CI

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest


    env:
      REPO: tome-server
      KEEP: 5


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TOKEN=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg s "$DOCKERHUB_TOKEN" '{identifier: $u, secret: $s}' \
            | curl -sf -X POST https://hub.docker.com/v2/auth/token -H "Content-Type: application/json" -d @- \
            | jq -r .access_token)

          OLD_TAGS=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/$REPO/tags?page_size=100" \
            | jq -r '.results | map(select(.name != "latest")) | sort_by(.last_updated) | reverse | .[($ENV.KEEP | tonumber):] | .[].name')

          for tag in $OLD_TAGS; do
            echo "삭제: $tag"
            curl -sf -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/$REPO/tags/$tag/"
          done