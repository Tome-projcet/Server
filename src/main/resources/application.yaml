spring:
  application:
    name: Tome
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tome}
    username: ${DB_USERNAME:dgsw05}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ...
            client-secret: ...
            scope:
              - email
              - profile

server:
  port: 8080


jwt:
  issuer: kmk541124@gmail.com
  # 운영에서는 반드시 .env 또는 환경변수 JWT_SECRET_KEY(32바이트 이상)로 바꿔서 쓸 것
  secret_key: ${JWT_SECRET_KEY}