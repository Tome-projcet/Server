spring:
  application:
    name: Tome
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  # JSON에 없는 int 필드를 0으로 받기 (Spring Boot 4의 Jackson 3는 기본값이 오류)
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ...
            client-secret: ...
            scope:
              - email
              - profile

server:
  port: 8080

# refresh_token 쿠키 속성 (로컬: false/Lax, 배포에서 프론트 도메인이 다르면: true/None)
cookie:
  refresh-token:
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

# 프론트엔드 주소 (여러 개면 쉼표로 구분)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


jwt:
  issuer: kmk541124@gmail.com
  # 운영에서는 반드시 .env 또는 환경변수 JWT_SECRET_KEY(32바이트 이상)로 바꿔서 쓸 것
  secret_key: ${JWT_SECRET_KEY}