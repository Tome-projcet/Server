spring:
  application:
    name: Tome
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ...
            client-secret: ...
            scope:
              - email
              - profile

server:
  port: 8080

cookie:
  refresh-token:
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


jwt:
  issuer: kmk541124@gmail.com
  # 운영에서는 반드시 .env 또는 환경변수 JWT_SECRET_KEY(32바이트 이상)로 바꿔서 쓸 것
  secret_key: ${JWT_SECRET_KEY}